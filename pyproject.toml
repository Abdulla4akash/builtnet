[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "builtnet"
version = "0.1.0"
description = "Construction rules of register-based population networks: construction cards, synthetic populations, and the theory of what each rule does to network measures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S M Abdulla Al Mamun" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
keywords = ["population-scale networks", "register data", "multilayer networks", "network construction", "social networks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
analysis = ["scikit-learn>=1.3"]
test = ["pytest>=8", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
builtnet = ["data/*.json", "cards/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
